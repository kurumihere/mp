name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      packaging-ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            shell: bash
          - name: windows
            os: windows-2025
            shell: msys2 {0}
          - name: macos
            os: macos-15
            shell: bash

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: checkout packaging
        if: inputs.packaging-ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.packaging-ref }}
          path: .release
          persist-credentials: false
          sparse-checkout: packaging

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream \
            imagemagick \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            desktop-file-utils \
            libfreetype6-dev \
            libglib2.0-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: setup msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-pkgconf

      - name: install macos dependencies
        if: runner.os == 'macOS'
        run: brew install dylibbundler freetype glib pkgconf

      - name: bootstrap
        run: cc -std=c99 -o nob nob.c

      - name: build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '13.0' || '' }}
        run: ./nob

      - name: package metadata
        if: inputs.package
        id: package
        shell: bash
        run: |
          release="${{ inputs.version || github.ref_name }}"
          version="${release#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $release" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: package linux
        if: inputs.package && runner.os == 'Linux'
        run: >-
          bash
          "${{ inputs.packaging-ref != '' && '.release/packaging' || 'packaging' }}/linux/package.sh"
          "${{ steps.package.outputs.version }}"

      - name: package windows
        if: inputs.package && runner.os == 'Windows'
        run: >-
          bash
          "${{ inputs.packaging-ref != '' && '.release/packaging' || 'packaging' }}/windows/package.sh"
          "${{ steps.package.outputs.version }}"

      - name: package macos
        if: inputs.package && runner.os == 'macOS'
        run: >-
          bash
          "${{ inputs.packaging-ref != '' && '.release/packaging' || 'packaging' }}/macos/package.sh"
          "${{ steps.package.outputs.version }}"

      - name: upload
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/mp-*.AppImage
            dist/mp-*.deb
            dist/mp-*.dmg
            dist/mp-*.exe
            dist/mp-*.rpm
            dist/mp-*.tar.gz
            dist/mp-*.zip
          if-no-files-found: error
          retention-days: 1
