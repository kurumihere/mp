name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            shell: bash
            package: linux-x86_64
            extension: tar.gz
          - name: windows
            os: windows-2025
            shell: msys2 {0}
            package: windows-x86_64
            extension: zip
          - name: macos
            os: macos-15
            shell: bash
            package: macos-arm64
            extension: tar.gz

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: setup msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: bootstrap
        run: cc -std=c99 -o nob nob.c

      - name: build
        run: ./nob

      - name: package
        if: inputs.package && runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="mp-${version}-${{ matrix.package }}"
          mkdir -p "dist/${package}"
          cp build/mp LICENSE README.md "dist/${package}/"
          cp -R assets "dist/${package}/assets"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"

      - name: package
        if: inputs.package && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = "mp-$version-${{ matrix.package }}"
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          Copy-Item build/mp.exe, LICENSE, README.md -Destination "dist/$package"
          Copy-Item assets -Destination "dist/$package/assets" -Recurse
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: upload
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/mp-*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1
